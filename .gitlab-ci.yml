stages:
  - build
  - test
  - release

variables:
  # Keep in sync with the UV_VERSION build argument of docker/Dockerfile
  UV_VERSION: "0.12.1"
  # Version of the tool that derives the package version from the git history
  DUNAMAI_VERSION: "1.17.0"
  # The kaniko component always pushes to CI_REGISTRY_IMAGE. GitLab leaves that
  # predefined variable empty when the project's Container Registry is not
  # enabled, which produces invalid destinations such as `:latest-dev`.
  # Reconstruct the standard registry path so --destination is a valid image.
  CI_REGISTRY_IMAGE: "${CI_REGISTRY}/${CI_PROJECT_PATH}"

include:
  - component: "$CI_SERVER_FQDN/ees/rdp/generic-components/rdp-cicd-components/kaniko@main"
    inputs:
      stage-test-image: test
      # No build arguments are needed anymore. All dependencies of the image are publicly available.
      build-args: ""
  # Same component, separate jobs. The component bakes the Dockerfile path into one shared
  # hidden job, so this include must keep the default Dockerfile. The cpu-torch jobs swap
  # that file in before_script and publish under a different image name. Otherwise they
  # would overwrite latest-dev / development-<sha> / main-<sha> of the slim image.
  - component: "$CI_SERVER_FQDN/ees/rdp/generic-components/rdp-cicd-components/kaniko@main"
    inputs:
      stage-test-image: test
      job-prefix: build-kaniko-cpu-torch
      build-args: ""

# Point the second Kaniko build at the CPU Chronos image without changing the tags the
# component appends (latest-dev, development-<sha>, main-<sha>, latest, release tags).
.cpu-torch-kaniko: &cpu-torch-kaniko
  before_script:
    - cp "$CI_PROJECT_DIR/docker/Dockerfile.cpu_torch" "$CI_PROJECT_DIR/docker/Dockerfile"
    - export INTERNAL_REGISTRY_DOCKER_IMAGE="${CI_REGISTRY_IMAGE}/cpu-torch"
    - export EXTERNAL_REGISTRY_DOCKER_IMAGE="${EXT_REGISTRY}/${CI_PROJECT_NAME}-cpu-torch"
    - if [ -n "$EXT_REGISTRY_0" ]; then export EXT_REGISTRY_IMAGE_0="${EXT_REGISTRY_0}/${CI_PROJECT_NAME}-cpu-torch"; fi

build-kaniko-cpu-torch-test-image:
  <<: *cpu-torch-kaniko

build-kaniko-cpu-torch-production-image:
  <<: *cpu-torch-kaniko

# =============================================================================
# Perform the unit test
#
# The test suite is executed against every supported interpreter. The template below is instantiated once per version
# via the extends mechanism, the concrete version is injected through the PYTHON_VERSION variable. Only the default
# version (3.13) additionally collects the coverage report, all versions publish their junit report.
#
# The default version 3.13 is defined in three places that have to be kept in sync: .python-version, the base images of
# docker/Dockerfile and the jobs below. The oldest supported version (3.10) follows from requires-python in
# pyproject.toml.
# =============================================================================

.test-python:
  stage: test
  needs: []  # no dependencies to precious pipelines stages
  # services:
  #   - name: ${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}/eclipse-mosquitto:2.1-alpine
  #     alias: mosquitto
  #   - name: ${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}/redis
  #     alias: redis
  #   - name: ${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}/influxdb:2
  #     alias: influxdb
  #     variables:
  #       DOCKER_INFLUXDB_INIT_MODE: "setup"
  #       DOCKER_INFLUXDB_INIT_USERNAME: ${DATA_CRAWLER_INFLUX_USER}
  #       DOCKER_INFLUXDB_INIT_PASSWORD: ${DATA_CRAWLER_INFLUX_PASSWORD}
  #       DOCKER_INFLUXDB_INIT_ORG: "ait"
  #       DOCKER_INFLUXDB_INIT_BUCKET: "ait-bucket"
  tags:
    - docker
    - x86_64
  image: ${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}/python:${PYTHON_VERSION}
  variables:
    UV_CACHE_DIR: "${CI_PROJECT_DIR}/.uv-cache"
    UV_NO_PROGRESS: "1"
    # Select the interpreter of the job image. UV_PYTHON overrides the .python-version pin of the repository, which
    # otherwise would request the default version in every job. Disabling the managed interpreters and their downloads
    # makes uv fail loudly instead of silently fetching another interpreter.
    UV_PYTHON: "${PYTHON_VERSION}"
    UV_NO_MANAGED_PYTHON: "1"
    UV_PYTHON_DOWNLOADS: "never"
    # Overridden by the default-version job to additionally collect the coverage
    PYTEST_COVERAGE_ARGS: ""
  cache:  # Reuse the downloaded wheels across pipeline runs
    key:
      files:
        - uv.lock
      prefix: "py${PYTHON_VERSION}"  # The wheels are interpreter specific
    paths:
      - .uv-cache
  script:
    - pip install --no-cache-dir uv==${UV_VERSION}
    # Install the exact dependency set of uv.lock. All third-party dependencies are publicly available, hence no
    # repository credentials are required anymore. Optional extras (e.g. chronos) are opt-in and must be
    # requested explicitly with --extra; they are not installed in CI or the default service image.
    # The cpu-torch image build installs the chronos extra.
    - uv sync --locked
    - uv run python -c "import sys; print('Testing with python', sys.version)"
    # Test the code. The import paths are configured via [tool.pytest.ini_options] in pyproject.toml.
    - uv run pytest ${PYTEST_COVERAGE_ARGS} --junitxml=report.xml --log-cli-level=INFO test
    - uv cache prune --ci
  artifacts:  # Collect test results
    when: always
    paths:
      - report.xml
    reports:
      junit: report.xml

test_python_3_10:  # The oldest supported interpreter, see requires-python in pyproject.toml
  extends: .test-python
  variables:
    PYTHON_VERSION: "3.10"

test_python_3_11:
  extends: .test-python
  variables:
    PYTHON_VERSION: "3.11"

test_python_3_12:
  extends: .test-python
  variables:
    PYTHON_VERSION: "3.12"

test_python_3_13:  # The default interpreter, see .python-version. Collects the coverage report.
  extends: .test-python
  variables:
    # Spelled out instead of referencing DEFAULT_PYTHON_VERSION: the value feeds the `image` keyword, and nesting one
    # CI variable inside another is not reliably expanded there. Keep in sync with DEFAULT_PYTHON_VERSION.
    PYTHON_VERSION: "3.13"
    PYTEST_COVERAGE_ARGS: "--cov --cov-report term --cov-report xml:coverage.xml"
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    when: always
    paths:
      - report.xml
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

test_python_3_14:
  extends: .test-python
  # The newest interpreter is tracked as an early warning only and must not block the pipeline yet. Remove the
  # allow_failure flag once the test suite is known to pass reliably on 3.14.
  allow_failure: true
  variables:
    PYTHON_VERSION: "3.14"

# =============================================================================
# Build the installable package
# =============================================================================

.build-package:
  stage: release
  tags:
    - docker
    - x86_64
  # Keep in sync with DEFAULT_PYTHON_VERSION (spelled out, see the note in test_python_3_13)
  image: ${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}/python:3.13
  variables:
    VERSION_FORMAT: "{base}.post{distance}.dev+{commit}"
    GIT_DEPTH: 0  # The full history including the tags is needed to derive the version
    UV_NO_PROGRESS: "1"
    # The wheel is pure python and therefore independent of the building interpreter. Use the image's one nonetheless.
    UV_PYTHON: "3.13"
    UV_NO_MANAGED_PYTHON: "1"
    UV_PYTHON_DOWNLOADS: "never"
    UV_PUBLISH_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi"
    UV_PUBLISH_USERNAME: "gitlab-ci-token"
    UV_PUBLISH_PASSWORD: "${CI_JOB_TOKEN}"
  script:
    - pip install --no-cache-dir uv==${UV_VERSION}
    # Derive a unique PEP 440 version from the git history: the base is taken from the latest reachable tag, the
    # distance to that tag makes the version monotonic and the commit hash makes it unique for every build.
    - DST_VERSION=$(uvx dunamai@${DUNAMAI_VERSION} from git --format "${VERSION_FORMAT}")
    - echo Write destination version $DST_VERSION
    - uv version --frozen "$DST_VERSION"
    # Build the source distribution and the wheel
    - uv build
    # Push the package to the GitLab package registry (credentials are provided via the UV_PUBLISH_* variables)
    - uv publish

build-package-main:
  extends: .build-package
  variables:
    VERSION_FORMAT: "{base}.post{distance}+{commit}"
  only:
    - main
    - master

build-package-development:
  extends: .build-package
  variables:
    VERSION_FORMAT: "{base}.post{distance}.dev+{commit}"
  only:
    - development
    - 44-provide-python-packages-for-project-extension
