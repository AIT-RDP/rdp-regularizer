[project]
name = "rdp-regularize"
version = "0.1.0"
description = "RDP regularizer service: regularizes jittery/gappy Redis measurement streams onto a strict time grid"
authors = [
    {name = "Edmund Widl", email = "edmund.widl@ait.ac.at"}
]
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "redis>=5.2.1,<6.0.0",
    "click>=8.1.8,<9.0.0",
    "peewee>=3.17.0,<4.0.0",
    "psycopg2-binary>=2.9.0,<3.0.0",
    "pyrdp-commons @ git+https://github.com/AIT-RDP/pyrdp-commons.git",
    "pandas>=2.3.3",
]

[dependency-groups]
dev = [
    "pytest>=7.3.2,<9.0.0",
    "pytest-cov>=4.1.0,<8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["regularizer"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
package = true
