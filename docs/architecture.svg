<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 230" role="img" aria-labelledby="title">
  <title id="title">RDP regularizer architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#656d76"/>
    </marker>
  </defs>
  <style>
    .box { fill: #f6f8fa; stroke: #8b949e; stroke-width: 1.5; }
    .label { fill: #1f2328; font-family: system-ui, -apple-system, Segoe UI, sans-serif; font-size: 13px; text-anchor: middle; }
    .edge { fill: none; stroke: #656d76; stroke-width: 1.5; marker-end: url(#arrow); }
    .edge-dash { stroke-dasharray: 6 4; }
    .edge-label { fill: #656d76; font-family: system-ui, -apple-system, Segoe UI, sans-serif; font-size: 11px; text-anchor: middle; }
  </style>

  <!-- Live path -->
  <rect class="box" x="8" y="24" width="168" height="48" rx="6"/>
  <text class="label" x="92" y="53">Redis input stream</text>

  <rect class="box" x="220" y="24" width="176" height="48" rx="6"/>
  <text class="label" x="308" y="53">RedisStreamSource</text>

  <rect class="box" x="440" y="24" width="108" height="48" rx="6"/>
  <text class="label" x="494" y="53">Channel</text>

  <rect class="box" x="592" y="24" width="160" height="48" rx="6"/>
  <text class="label" x="672" y="53">RedisStreamSink</text>

  <rect class="box" x="796" y="24" width="176" height="48" rx="6"/>
  <text class="label" x="884" y="53">Redis output stream</text>

  <line class="edge" x1="176" y1="48" x2="214" y2="48"/>
  <line class="edge" x1="396" y1="48" x2="434" y2="48"/>
  <line class="edge" x1="548" y1="48" x2="586" y2="48"/>
  <line class="edge" x1="752" y1="48" x2="790" y2="48"/>

  <!-- Optional bootstrap -->
  <rect class="box" x="8" y="148" width="168" height="48" rx="6"/>
  <text class="label" x="92" y="177">TimescaleDB</text>

  <rect class="box" x="220" y="148" width="176" height="48" rx="6"/>
  <text class="label" x="308" y="177">HistoryProvider</text>

  <line class="edge edge-dash" x1="176" y1="172" x2="214" y2="172"/>
  <text class="edge-label" x="196" y="140">optional bootstrap</text>
  <path class="edge edge-dash" d="M 308 148 L 308 100 L 494 100 L 494 78"/>
</svg>
